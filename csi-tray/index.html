<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hashnet</title>
  <style>
    :root {
      --bg: rgba(36, 36, 36, 0.85);
      --text-main: #ffffff;
      --text-sub: #a5a5a7;
      --accent: #FF9500; /* Primary System Orange */
      --border: rgba(255, 255, 255, 0.08);
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-weight: 400; }
    html { height: 100%; background: transparent; }
    body {
      width: 380px; height: fit-content; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden; user-select: none; -webkit-user-select: none;
    }
    #main-container {
      display: flex; position: relative; width: 380px; height: fit-content; background: transparent;
    }
    #body-wrap {
      width: 250px; background: var(--bg); border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex; flex-direction: column; flex-shrink: 0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); position: relative;
      backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
      padding: 4px; /* Enables beautiful inset highlights */
    }
    #error-bar { display: none; font-size: 11px; padding: 4px 8px; background: #FF453A; color: #fff; word-break: break-all; margin: 2px 4px; border-radius: 4px; }
    
    /* Inset rows with rounded highlights, just like macOS Native */
    .row {
      display: flex; align-items: center; padding: 3px 8px; cursor: pointer; min-height: 24px;
      transition: background 0.1s ease, color 0.1s ease;
      margin: 1px 4px; border-radius: 6px;
    }
    .row:not(.static-row):hover {
      background: var(--accent);
    }
    .row:not(.static-row):hover .title { color: #ffffff !important; }
    .row:not(.static-row):hover .subtitle { color: rgba(255, 255, 255, 0.8) !important; }
    .row:not(.static-row):hover .chevron { color: rgba(255, 255, 255, 0.9) !important; }
    
    .row-text { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }
    .title { font-size: 13px; font-weight: 500; color: var(--text-main); letter-spacing: -0.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.1s; }
    .subtitle { font-size: 11px; color: var(--text-sub); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.1s; }
    
    /* Expand dividers to full width despite parent padding */
    hr { border: none; border-top: 1px solid var(--border); margin: 3px -4px; }
    
    /* Compact Toggle */
    .toggle { position: relative; display: inline-block; width: 32px; height: 18px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .track { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #39393d; transition: .2s; border-radius: 18px; }
    .track:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background: white; transition: .2s; border-radius: 50%; }
    input:checked + .track { background: var(--accent); }
    input:checked + .track:before { transform: translateX(14px); }
    
    /* Compact Avatar */
    .avatar { width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; margin-right: 8px; overflow: hidden; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .chevron { color: var(--text-sub); font-size: 13px; transition: transform 0.2s, color 0.1s; margin-left: 4px; flex-shrink: 0; }
    .chevron.rotated { transform: rotate(90deg); }
    
    /* List Panels: Smooth & Fast 150ms slide transition */
    .list-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.15s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .list-panel.open {
      max-height: 150px;
    }
    
    .list-item { padding: 5px 12px 5px 24px; font-size: 11.5px; color: var(--text-sub); border-bottom: 1px solid rgba(255,255,255,0.02); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-item:last-child { border-bottom: none; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 24px; font-size: 11.5px; color: var(--text-sub); border-bottom: 1px solid rgba(255,255,255,0.02); }
    .file-item:last-child { border-bottom: none; }
    .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px; }
    .btn-open { background: var(--accent); color: #fff; border: none; border-radius: 3px; font-size: 10px; padding: 1px 6px; cursor: pointer; flex-shrink: 0; font-family: inherit; }
    
    .connected-only { display: none; }
    
    /* Compact Overlapping Modal matching design precisely */
    #account-modal { display: none; position: absolute; top: 38px; left: 242px; z-index: 200; width: 120px; }
    #account-modal-box {
      background: var(--bg); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); overflow: hidden; min-width: 120px;
      backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
      padding: 4px;
    }
    .modal-row {
      padding: 5px 8px; font-size: 12px; color: var(--text-main); cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease; font-weight: 500;
      margin: 1px 2px; border-radius: 6px;
    }
    .modal-row:hover {
      background: var(--accent); color: #ffffff !important;
    }
    .modal-row.danger { color: #FF453A; }
    .modal-row.danger:hover { background: #FF453A; color: #ffffff !important; }
  </style>
</head>
<body>
  <div id="main-container">
    <div id="body-wrap">
      <div id="error-bar"></div>

      <div class="row static-row" style="cursor:default">
        <div class="row-text">
          <div class="title">Hashnet</div>
          <div class="subtitle" id="systemStateText">Connecting…</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="mainToggle" disabled>
          <span class="track"></span>
        </label>
      </div>
      <hr>

      <div class="row" id="btnAccount">
        <div class="avatar" id="avatarBox"><span>?</span></div>
        <div class="row-text">
          <div class="title" id="userName">Not logged in</div>
          <div class="subtitle" id="userSub">Click to sign in</div>
        </div>
        <span class="chevron" id="accountChevron" style="display:none">›</span>
      </div>
      <hr>

      <div class="connected-only" id="connectedSection">
        <div class="row" id="btnNetwork">
          <div class="row-text"><div class="title">Devices</div></div>
          <span class="chevron" id="networkChevron">›</span>
        </div>
        <div class="list-panel" id="networkList"></div>

        <div class="row" id="btnFiles">
          <div class="row-text"><div class="title">Encrypted Files</div></div>
          <span class="chevron" id="filesChevron">›</span>
        </div>
        <div class="list-panel" id="filesList"></div>

        <div class="row" id="btnSync">
          <div class="row-text"><div class="title">Sync Keys</div></div>
        </div>
        <hr>
      </div>

      <div class="row" id="btnQuit">
        <div class="row-text"><div class="title">Quit</div></div>
      </div>
    </div>

    <div id="account-modal">
      <div id="account-modal-box">
        <div class="modal-row" id="modalDashboard">Dashboard</div>
        <div class="modal-row danger" id="modalLogout">Logout</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var sub = document.getElementById('systemStateText');
      function el(id) { return document.getElementById(id); }

      async function ipc(req) {
        try {
          var t = window.__TAURI__;
          var fn = t.invoke || (t.tauri && t.tauri.invoke);
          return await fn('send_ipc_command', { req: req });
        } catch(e) { return null; }
      }

      // State Management
      var state = {
        loggedIn: false,
        modalOpen: false,
        panels: {
          devices: { open: false, data: null, loading: false },
          files: { open: false, data: null, loading: false }
        }
      };

      function showModal() {
        if (!state.loggedIn) return;
        el('account-modal').style.display = 'block';
        state.modalOpen = true;
        animateWindowResize();
      }

      function hideModal() {
        el('account-modal').style.display = 'none';
        state.modalOpen = false;
        animateWindowResize();
      }

      // Click to toggle modal when logged in
      el('btnAccount').addEventListener('mousedown', function(e) {
        if (!state.loggedIn) {
          el('userSub').textContent = 'Opening browser…';
          ipc('StartOAuthFlow');
        } else {
          e.stopPropagation();
          if (state.modalOpen) {
            hideModal();
          } else {
            showModal();
          }
        }
      });

      // Hide modal when mouse leaves the modal box
      el('account-modal').addEventListener('mouseleave', function() {
        hideModal();
      });

      // Also hide modal if user moves onto any other interactive row
      document.querySelectorAll('.row').forEach(function(row) {
        if (row.id !== 'btnAccount') {
          row.addEventListener('mouseenter', function() {
            if (state.modalOpen) hideModal();
          });
        }
      });

      el('modalDashboard').addEventListener('mousedown', function() {
        window.__TAURI__.shell.open('https://www.bluehashsecurity.com/dashboard/devices');
        hideModal();
      });

      el('modalLogout').addEventListener('mousedown', async function() {
        hideModal();
        await ipc('Logout');
        setLoggedOut();
      });

      function setLoggedOut() {
        state.loggedIn = false;
        state.panels.devices.open = false;
        state.panels.files.open = false;
        el('connectedSection').style.display = 'none';
        el('accountChevron').style.display = 'none';
        el('userName').textContent = 'Not logged in';
        el('userSub').textContent = 'Click to sign in';
        el('avatarBox').innerHTML = '<span>?</span>';
        sub.textContent = 'Disconnected';
        el('mainToggle').checked = false;
        hideModal();
        renderPanels();
        animateWindowResize();
      }

      el('btnQuit').addEventListener('mousedown', async function() {
        await ipc('Logout');
        await ipc('RotatePnk');
        if (window.__TAURI__ && window.__TAURI__.process) {
          window.__TAURI__.process.exit(0);
        } else {
          window.close();
        }
      });

      // Devices toggle
      el('btnNetwork').addEventListener('mousedown', function() {
        togglePanel('devices');
      });

      // Encrypted Files toggle
      el('btnFiles').addEventListener('mousedown', function() {
        togglePanel('files');
      });

      function togglePanel(panelName) {
        var isDevices = panelName === 'devices';
        var activeState = isDevices ? state.panels.devices : state.panels.files;
        var inactiveState = isDevices ? state.panels.files : state.panels.devices;
        
        // Toggle the target panel
        activeState.open = !activeState.open;
        
        // Close the other panel (Accordion)
        if (activeState.open) {
          inactiveState.open = false;
        }
        
        renderPanels();
        animateWindowResize(); // Smoothly resize the Tauri window during the CSS transition!
        
        // If opened, fetch content asynchronously
        if (activeState.open) {
          fetchPanelData(panelName);
        }
      }

      function renderPanels() {
        var devPanel = el('networkList');
        var devChevron = el('networkChevron');
        var filesPanel = el('filesList');
        var filesChevron = el('filesChevron');
        
        // Render Devices Panel
        if (state.panels.devices.open) {
          devPanel.classList.add('open');
          devChevron.classList.add('rotated');
          if (state.panels.devices.loading) {
            devPanel.innerHTML = '<div class="list-item">Loading…</div>';
          } else if (state.panels.devices.data) {
            var uniqueNames = [...new Set(state.panels.devices.data)];
            devPanel.innerHTML = uniqueNames.length
              ? uniqueNames.map(name => `<div class="list-item">${name}</div>`).join('')
              : '<div class="list-item">No other devices</div>';
          } else {
            devPanel.innerHTML = '<div class="list-item">No other devices</div>';
          }
        } else {
          devPanel.classList.remove('open');
          devChevron.classList.remove('rotated');
        }
        
        // Render Files Panel
        if (state.panels.files.open) {
          filesPanel.classList.add('open');
          filesChevron.classList.add('rotated');
          if (state.panels.files.loading) {
            filesPanel.innerHTML = '<div class="list-item">Loading…</div>';
          } else if (state.panels.files.data) {
            if (state.panels.files.data.length === 0) {
              filesPanel.innerHTML = '<div class="list-item">No encrypted files</div>';
            } else {
              filesPanel.innerHTML = state.panels.files.data.map(function(f) {
                var enc = f.enc_path.replace(/"/g, '&quot;');
                return '<div class="file-item"><span class="file-name" title="'+enc+'">'+f.original_name+'</span><button class="btn-open" data-enc="'+enc+'">Open</button></div>';
              }).join('');
              filesPanel.querySelectorAll('.btn-open').forEach(function(btn) {
                btn.addEventListener('mousedown', async function(e) {
                  e.stopPropagation();
                  btn.disabled = true;
                  btn.textContent = '…';
                  var r = await ipc({ OpenFile: { enc_path: btn.dataset.enc } });
                  if (r && r.Error) { btn.textContent = 'Err'; setTimeout(function(){ btn.textContent='Open'; btn.disabled=false; }, 2000); }
                  else { btn.textContent = 'Open'; btn.disabled = false; }
                });
              });
            }
          } else {
            filesPanel.innerHTML = '<div class="list-item">No encrypted files</div>';
          }
        } else {
          filesPanel.classList.remove('open');
          filesChevron.classList.remove('rotated');
        }
      }

      async function fetchPanelData(panelName) {
        var isDevices = panelName === 'devices';
        var activeState = isDevices ? state.panels.devices : state.panels.files;
        
        activeState.loading = true;
        renderPanels();
        
        if (isDevices) {
          var resp = await ipc('GetNetworkDevices');
          activeState.loading = false;
          if (resp && resp.NetworkDevices) {
            activeState.data = resp.NetworkDevices;
          } else {
            activeState.data = null;
          }
        } else {
          var resp = await ipc('GetFiles');
          activeState.loading = false;
          if (resp && resp.Files) {
            activeState.data = resp.Files;
          } else {
            activeState.data = null;
          }
        }
        
        renderPanels();
        animateWindowResize();
      }

      // Dynamic resize of the transparent Tauri window based on container height & modal width
      function triggerResize() {
        try {
          var t = window.__TAURI__;
          if (t && t.window && t.window.appWindow) {
            var h = el('body-wrap').offsetHeight;
            var w = state.modalOpen ? 370 : 250;
            t.window.appWindow.setSize(new t.window.LogicalSize(w, h));
          }
        } catch(e) {}
      }

      // requestAnimationFrame loop to smoothly synchronize window bounds with CSS transitions (150ms duration)
      function animateWindowResize() {
        var startTime = performance.now();
        var duration = 160; // Slightly over 150ms to ensure final snap captures complete transition
        
        function step(timestamp) {
          triggerResize();
          var elapsed = timestamp - startTime;
          if (elapsed < duration) {
            requestAnimationFrame(step);
          } else {
            triggerResize();
          }
        }
        requestAnimationFrame(step);
      }

      // Automatically observe and resize window on container layout updates
      var resizeTimer = null;
      var observer = new MutationObserver(function() {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(triggerResize, 10);
      });
      observer.observe(el('body-wrap'), { attributes: true, childList: true, subtree: true });

      // Poll state
      setInterval(async function() {
        var resp = await ipc('GetStatus');
        if (resp && resp.Status && resp.Status.is_active) {
           var s = resp.Status;
           state.loggedIn = true;
           el('userName').textContent = s.email || 'User Profile';
           el('userSub').textContent = 'Connected';
           el('accountChevron').style.display = 'inline';
           el('connectedSection').style.display = 'block';
           sub.textContent = 'Connected';
           el('mainToggle').checked = true;
           
           if (s.image_url) {
             el('avatarBox').innerHTML = `<img src="${s.image_url}" alt="">`;
           } else {
             var initial = (s.email || 'U')[0].toUpperCase();
             el('avatarBox').innerHTML = `<span>${initial}</span>`;
           }
        } else if (!state.loggedIn) {
           setLoggedOut();
        }
      }, 2000);

    })();
  </script>
</body>
</html>
