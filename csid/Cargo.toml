[package]
name = "csid"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
csi-core = { version = "0.1.0", path = "../csi-core" }
csi-ipc = { version = "0.1.0", path = "../csi-ipc" }
dotenvy = "0.15.7"
gethostname = "1.1.0"
open = "5.3.5"
rand = "0.8"
reqwest = { version = "0.13.3", features = ["form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v4"] }
